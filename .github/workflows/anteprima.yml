# Fotografa ogni schermata di SolidOS Mobile (tema scuro e chiaro) senza schermo,
# e controlla che il codice Python e QML si carichi. Le foto restano negli artefatti.
name: Anteprima

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  foto:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Qt, icone e caratteri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            python3-pyqt6 python3-pyqt6.qtquick qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates \
            qml6-module-qtqml-workerscript papirus-icon-theme fonts-inter fonts-league-spartan fonts-noto-core >/dev/null
          # Disegno delle icone SVG (il nome del pacchetto cambia tra Debian e Ubuntu)
          apt-cache search --names-only 'qt6.*svg' | cut -d' ' -f1 | tee /dev/stderr | xargs sudo apt-get install -y -qq --no-install-recommends >/dev/null

      - name: Controllo del codice (Python e QML)
        run: |
          python3 -m compileall -q src
          python3 scripts/controlla.py

      - name: Foto di ogni schermata
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          NUCLEO_DEMO: "1"
          LANG: it_IT.UTF-8
        run: |
          mkdir -p foto
          errori=0
          for tema in scuro chiaro; do
            if [ "$tema" = chiaro ]; then export NUCLEO_TEMA_ICONE=Papirus-Light; else export NUCLEO_TEMA_ICONE=Papirus-Dark; fi
            for sch in blocco home libreria controllo notifiche personalizza telefono recenti messaggi conversazione chiamata contatti scheda banner impostazioni wifi rete batteria info solidid; do
              timeout 40 scripts/anteprima.sh --schermata=$sch --tema=$tema --foto="$PWD/foto/$tema-$sch.png" >log.txt 2>&1 || true
              if [ -s "foto/$tema-$sch.png" ]; then echo "OK   $tema $sch"; else echo "ERRORE $tema $sch"; errori=$((errori+1)); tail -n 25 log.txt | sed 's/^/    | /'; fi
              grep -iE "error|referenceerror|typeerror|is not defined|cannot" log.txt | grep -v "QStandardPaths" | head -10 || true
            done
          done
          ls -la foto
          [ "$errori" -eq 0 ]

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foto-schermate
          path: foto/
          retention-days: 30
