# Costruisce SolidOS Mobile per i telefoni supportati (postmarketOS) e pubblica nelle
# Releases UN SOLO file zip per ogni telefono.
name: Telefoni

on:
  workflow_dispatch:
    inputs:
      telefoni:
        description: "Codici dei telefoni (JSON), es. [\"huawei-warsaw\"]"
        default: '["huawei-warsaw","oneplus-enchilada","oneplus-fajita","google-sargo","fairphone-fp4","shift-axolotl","pine64-pinephonepro"]'
  push:
    tags: ["telefono-v*"]

permissions:
  contents: write

jobs:
  immagine:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(github.event.inputs.telefoni || '["huawei-warsaw","oneplus-enchilada","oneplus-fajita","google-sargo","fairphone-fp4","shift-axolotl","pine64-pinephonepro"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Strumenti
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zip git openssl >/dev/null

      - name: Costruisci per ${{ matrix.device }}
        run: telefono/costruisci.sh "${{ matrix.device }}"

      - name: Registro di pmbootstrap (se qualcosa va storto)
        if: failure()
        run: tail -n 300 ~/.local/var/pmbootstrap/log.txt || true

      - name: Pubblica nelle Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP=$(cat uscita/nome-zip.txt); NOME=$(cat uscita/nome-telefono.txt)
          TAG="telefono-${{ matrix.device }}-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" "uscita/$ZIP" \
            --title "SolidOS Mobile per $NOME ($(date +%d/%m/%Y))" \
            --notes-file uscita/LEGGIMI.txt
